name: Build NetHunter Kernel
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Build Kernel
        run: |
          sudo apt-get update && sudo apt-get install -y bc bison build-essential ccache curl flex git gnupg gperf imagemagick liblz4-tool libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 python3 cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          git clone --depth=1 https://github.com/steftim/kernel_xiaomi_angelican.git kernel
          git clone --depth=1 https://github.com/wumingzhinu/kali-nethunter-kernel-patches.git nh-patches
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd kernel
          patch -p1 < ../nh-patches/4.19/add-hid-gadget-4.19.patch || true
          sed -i 's/-Werror//g' Makefile
          sed -i 's/static void free(/static void xts_free(/g' crypto/xts.c
          sed -i 's/\.free\s*=\s*free,/\.free = xts_free,/g' crypto/xts.c
          DEFCONFIG=$(find arch/arm64/configs -name "*angelica*defconfig" | head -n 1 | xargs basename)
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_USB_G_HID=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_HID_GENERIC=y" >> arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_USB_HIDDEV=y" >> arch/arm64/configs/$DEFCONFIG
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out $DEFCONFIG
          make -j$(nproc --all) O=out Image.gz-dtb
          cp out/arch/arm64/boot/Image.gz-dtb ../anykernel/
          cd ../anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's|/dev/block/platform/omap/omap_hsmmc.0/by-name/boot|/dev/block/by-name/boot|g' anykernel.sh
          zip -r9 ../angelica-nethunter-kernel.zip * -x .git README.md *placeholder
      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: angelica-nethunter-kernel
          path: angelica-nethunter-kernel.zip
